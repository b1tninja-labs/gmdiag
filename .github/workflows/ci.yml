name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # gmdiag is a Windows-only tool (the live VCX transmit is #[cfg(windows)] and the
    # dongle is a Windows USB serial device), so CI runs on Windows. A Linux runner
    # only flags cross-platform dead-code/unused-import noise in code paths this tool
    # never uses off Windows.
    runs-on: windows-latest
    steps:
      # gmdiag path-depends on its portfolio siblings by `../<name>`. Check each one
      # out as a flat sibling directory so `../udskit` … `../vcxtoolkit` resolve, then
      # run cargo from the gmdiag dir. All siblings are public, so the default token
      # reads them. fakeobd is not a path dep (spawned, not linked); its live tests
      # SKIP when the binary is absent.
      - uses: actions/checkout@v4
        with:
          path: gmdiag
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/isotpkit
          path: isotpkit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/gmdtcdb
          path: gmdtcdb
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/mode06kit
          path: mode06kit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcxtoolkit
          path: vcxtoolkit
      - uses: actions/checkout@v4
        with:
          # vcikit holds both `vcikit` and its `j2534/` member (the vendor-DLL transport,
          # a Windows-only dependency of the `--dll` read path).
          repository: b1tninja-labs/vcikit
          path: vcikit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: gmdiag
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gmdiag
      - run: cargo test
        working-directory: gmdiag
      - run: cargo doc --no-deps
        working-directory: gmdiag
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gmdiag
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/isotpkit
          path: isotpkit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/gmdtcdb
          path: gmdtcdb
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/mode06kit
          path: mode06kit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcxtoolkit
          path: vcxtoolkit
      - uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcikit
          path: vcikit
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test
        working-directory: gmdiag
